[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React single-page application fallback. Keep this after any future API/static rules.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits fingerprinted assets under /assets/; cache them for efficient repeat visits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Avoid caching the HTML shell so deployments can pick up new asset hashes promptly.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
